<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invasión de Marcianos Caóticos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace; /* Estilo arcade retro */
        }

        /* Botón de Inicio */
        #btn-inicio {
            padding: 18px 45px;
            font-size: 1.6rem;
            color: #ffffff;
            background: transparent;
            border: 2px solid #ffffff;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            z-index: 10;
        }

        #btn-inicio:hover {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.9);
            transform: scale(1.08);
        }

        /* Controles flotantes */
        .controles {
            display: none;
            position: fixed;
            top: 25px;
            right: 25px;
            gap: 12px;
            z-index: 20;
        }

        .btn-control {
            padding: 10px 22px;
            font-size: 0.95rem;
            color: #fff;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-control:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        #btn-salir:hover {
            background: rgba(255, 0, 85, 0.8);
            border-color: #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
        }

        /* Contenedor del lienzo */
        #canvas-container {
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Botón de Inicio -->
    <button id="btn-inicio">INICIAR INVASIÓN</button>

    <!-- Controles flotantes -->
    <div class="controles" id="panel-controles">
        <button class="btn-control" id="btn-audio">🔊 Sonido: ON</button>
        <button class="btn-control" id="btn-salir">Salir</button>
    </div>

    <!-- Contenedor del lienzo -->
    <div id="canvas-container">
        <canvas id="marcianosCanvas"></canvas>
    </div>

    <script>
        const btnInicio = document.getElementById('btn-inicio');
        const btnSalir = document.getElementById('btn-salir');
        const btnAudio = document.getElementById('btn-audio');
        const panelControles = document.getElementById('panel-controles');
        const canvasContainer = document.getElementById('canvas-container');
        const canvas = document.getElementById('marcianosCanvas');
        const ctx = canvas.getContext('2d');

        let animacionId = null;
        let marcianos = [];
        let activo = false;

        // Variables de Audio (Volumen Máximo + Compresor estilo 8-bits)
        let audioCtx = null;
        let audioActivo = true;
        let masterGain = null;
        let compresor = null;
        let filtro = null;
        let tiempoBucleMusica = null;
        let pasoRitmo = 0;

        function ajustarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', ajustarCanvas);

        // Clase para cada Marciano Caótico
        class Marciano {
            constructor() {
                this.reiniciar();
            }

            reiniciar() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 8; // Velocidad horizontal aleatoria
                this.vy = (Math.random() - 0.5) * 8; // Velocidad vertical aleatoria
                this.angulo = Math.random() * Math.PI * 2;
                this.vRotacion = (Math.random() - 0.5) * 0.15; // Velocidad de giro sobre sí mismo
                this.escala = Math.random() * 0.8 + 0.6; // Tamaño variable
                this.tipoSalto = Math.random() * 100; // Para fases de salto únicas
            }

            actualizar() {
                this.x += this.vx;
                this.y += this.vy;
                this.angulo += this.vRotacion;

                // Rebote caótico en los bordes de la pantalla
                if (this.x < 30 || this.x > canvas.width - 30) {
                    this.vx *= -1;
                    this.vRotacion *= -1; // Invierte el giro al rebotar
                }
                if (this.y < 30 || this.y > canvas.height - 30) {
                    this.vy *= -1;
                    this.vRotacion *= -1;
                }

                // Añadir pequeños saltos repentinos simulando gravedad o tirones locos
                if (Math.random() < 0.02) {
                    this.vx += (Math.random() - 0.5) * 6;
                    this.vy += (Math.random() - 0.5) * 6;
                }
            }

            dibujar() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angulo);
                ctx.scale(this.escala, this.escala);

                // Estilo clásico de marciano blanco brillante estilo retro arcade
                ctx.strokeStyle = '#ffffff';
                ctx.fillStyle = '#ffffff';
                ctx.lineWidth = 2.5;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#ffffff';

                // Dibujar forma de marciano pixelado / clásico simétrico
                // Antenas
                ctx.beginPath();
                ctx.moveTo(-10, -18);
                ctx.lineTo(-15, -28);
                ctx.moveTo(10, -18);
                ctx.lineTo(15, -28);
                ctx.stroke();

                // Cabeza / Cuerpo superior
                ctx.strokeRect(-14, -18, 28, 12);

                // Ojos (negros para hacer contraste con el blanco)
                ctx.fillStyle = '#000000';
                ctx.fillRect(-8, -14, 4, 4);
                ctx.fillRect(4, -14, 4, 4);

                // Cuerpo inferior / Patitas caóticas
                ctx.strokeStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(-14, -6);
                ctx.lineTo(-18, 10);
                ctx.lineTo(-10, 10);
                ctx.lineTo(-6, 2);
                ctx.moveTo(14, -6);
                ctx.lineTo(18, 10);
                ctx.lineTo(10, 10);
                ctx.lineTo(6, 2);
                ctx.stroke();

                ctx.restore();
            }
        }

        function inicializarInvasion() {
            marcianos = [];
            // Crear 25 pequeños marcianos caóticos
            for (let i = 0; i < 25; i++) {
                marcianos.push(new Marciano());
            }
        }

        // --- SISTEMA DE AUDIO ARCADE (Volumen Máximo) ---
        function reproducirMusicaArcade() {
            if (!audioActivo || !audioCtx || audioCtx.state !== 'running' || !activo) return;

            const tiempoActual = audioCtx.currentTime;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square'; // Sonido clásico de maquinita arcade de 8 bits

            const notasArcade = [150, 220, 300, 440, 330, 277, 523, 392];
            let freq = notasArcade[pasoRitmo % notasArcade.length];

            // Variación aleatoria para que suene caótico y divertido
            if (pasoRitmo % 3 === 0) freq *= 1.25;

            osc.frequency.setValueAtTime(freq, tiempoActual);

            // Volumen máximo absoluto (1.0) con decaimiento rápido
            gain.gain.setValueAtTime(1.0, tiempoActual);
            gain.gain.exponentialRampToValueAtTime(0.001, tiempoActual + 0.1);

            osc.connect(gain);
            gain.connect(filtro);
            osc.start(tiempoActual);
            osc.stop(tiempoActual + 0.11);

            pasoRitmo++;
            tiempoBucleMusica = setTimeout(reproducirMusicaArcade, 110);
        }

        function iniciarMusica() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } else if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(audioActivo ? 1.0 : 0, audioCtx.currentTime);

            compresor = audioCtx.createDynamicsCompressor();
            compresor.threshold.setValueAtTime(-15, audioCtx.currentTime);
            compresor.ratio.setValueAtTime(15, audioCtx.currentTime);

            filtro = audioCtx.createBiquadFilter();
            filtro.type = 'lowpass';
            filtro.frequency.setValueAtTime(2500, audioCtx.currentTime);

            filtro.connect(compresor);
            compresor.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            pasoRitmo = 0;
            reproducirMusicaArcade();
        }

        function detenerMusica() {
            if (tiempoBucleMusica) clearTimeout(tiempoBucleMusica);
            tiempoBucleMusica = null;
            if (masterGain && audioCtx) {
                masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            }
        }

        btnAudio.addEventListener('click', () => {
            audioActivo = !audioActivo;
            btnAudio.textContent = audioActivo ? "🔊 Sonido: ON" : "🔇 Sonido: OFF";
            if (masterGain && audioCtx) {
                masterGain.gain.setValueAtTime(audioActivo ? 1.0 : 0, audioCtx.currentTime);
                if (audioActivo && activo && !tiempoBucleMusica) {
                    reproducirMusicaArcade();
                }
            }
        });

        // --- CONTROLES DE LA PÁGINA ---
        btnInicio.addEventListener('click', () => {
            btnInicio.style.display = 'none';
            panelControles.style.display = 'flex';
            canvasContainer.style.display = 'flex';
            
            ajustarCanvas();
            inicializarInvasion();
            activo = true;

            iniciarAnimacion();
            iniciarMusica();
        });

        btnSalir.addEventListener('click', () => {
            activo = false;
            if (animacionId) cancelAnimationFrame(animacionId);
            detenerMusica();

            canvasContainer.style.display = 'none';
            panelControles.style.display = 'none';
            btnInicio.style.display = 'block';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // --- BUCLE DE ANIMACIÓN DE LOS MARCIANOS ---
        function iniciarAnimacion() {
            if (!activo) return;

            // Fondo negro puro con estela sutil para los giros
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Actualizar y dibujar cada marciano en su locura de saltos y giros
            for (let i = 0; i < marcianos.length; i++) {
                marcianos[i].actualizar();
                marcianos[i].dibujar();
            }

            animacionId = requestAnimationFrame(iniciarAnimacion);
        }
    </script>
</body>
</html>
